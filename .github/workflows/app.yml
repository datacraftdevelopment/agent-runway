# Every push and PR: the Python tests, the Swift tests, and a release dry run (built, signed ad hoc, zipped,
# appcast written; not notarized, not published). Needs no secrets.
name: app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Python tests
        run: python3 -m unittest discover -s tests -t .
      - name: Swift tests
        working-directory: app
        run: swift test
      - name: Release dry run
        working-directory: app
        run: RUNWAY_RELEASE_CHECK_CMD=true bash make-app.sh --release --dry-run
      - name: Check the dry-run app
        working-directory: app
        run: |
          codesign --verify --deep --strict build/Runway.app
          test -d build/Runway.app/Contents/Frameworks/Sparkle.framework
          test -s build/Runway.app/Contents/Resources/LICENSE
          test -s build/Runway.app/Contents/Resources/AppIcon.icns
          test -s build/release/Runway.dmg
          hdiutil verify build/release/Runway.dmg
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Runway.app/Contents/Info.plist
          grep -q '<enclosure url="https://github.com/datacraftdevelopment/agent-runway/releases/download/v' build/release/appcast.xml
          ls -l build/release
      - name: The build leaves the tree clean (a real release refuses a dirty one)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
